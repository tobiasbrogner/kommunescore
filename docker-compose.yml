services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kommunescore
      POSTGRES_PASSWORD: kommunescore
      POSTGRES_DB: kommunescore
    ports:
      - "5432:5432"
    volumes:
      - kommunescore-db:/var/lib/postgresql/data

volumes:
  kommunescore-db:
